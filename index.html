        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-outline { background-color: transparent; color: var(--accent); border: 1px solid var(--accent); }

        .contact-icon i { font-size: 24px; font-style: normal; }
        .accordion-item { background: var(--card-bg); border-radius: var(--radius); margin-bottom: 12px; border: var(--border); overflow: hidden; }
        .accordion-header { padding: 18px 20px; font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .accordion-content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; }
        .accordion-inner { min-height: 0; overflow: hidden; }
        .accordion-content.open { grid-template-rows: 1fr; }
        .accordion-body { padding: 0 20px 20px; font-size: 14px; line-height: 1.6; color: #555; }
        .block-text { margin-bottom: 15px; }
        .block-text b { display: block; margin-bottom: 5px; color: #111; }
        ul.custom-list { padding-left: 20px; margin-bottom: 15px; }
        ul.custom-list li { margin-bottom: 6px; }

        .quote-box { font-style: italic; font-weight: 600; color: var(--accent); text-align: center; margin: 10px 0 20px; font-size: 15px; }
        .tabs-container { display: flex; border-bottom: 2px solid #e8e0d5; margin: 10px 20px; }
        .tab-btn { flex: 1; background: none; border: none; color: #999; padding: 15px 0; font-size: 15px; font-weight: 600; cursor: pointer; position: relative; transition: color 0.3s; }
        .tab-btn.active { color: var(--accent); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px; background-color: var(--accent); }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .link-list { display: flex; flex-direction: column; gap: 10px; }

        .admin-login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }

        .admin-tabs-row button.inactive { background: #e0e0e0; color: #555; }
        .admin-tabs-row button.add-btn { background: #0066cc; color: #fff; }
        
        .admin-group { border: 1px solid #ddd; border-radius: 12px; margin-bottom: 15px; background: #fff; overflow: hidden; }
        .admin-group-header { padding: 16px 20px; background: #f8f9fa; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }

        .admin-list-item { border: 1px solid #e1e1e1; border-radius: 8px; padding: 15px; margin-bottom: 12px; background: #fcfcfc; position: relative; }
        
        .admin-controls { display: flex; gap: 5px; margin-bottom: 10px; align-items:center; }
        .admin-controls button { padding: 4px 8px; font-size: 12px; border-radius: 4px; border: 1px solid #ccc; background:#fff; cursor: pointer; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.2s ease; }

</head>

                            links: "스트리머 프로젝트 홈페이지 링크|#\\n프로젝트 지원 링크|#\\n치지직 채널 바로가기|#\\n공식 유튜브 채널|#\\n공식 X (트위터) 채널|#"

                    ],
                    footer: {
                        title: "🛡️ 안전, 미래 세대 (교육 자료 지원)", quote: "보호받아야 할 아이들의 내일을 지키는 첫걸음",
                        text: "카퍼컴퍼니는 우리 사회의 가장 취약한 곳에 있는 아동과 청소년들이 안전한 환경에서 올바르게 성장할 수 있도록 배움의 기회를 넓힙니다. 광주광역시 어린이들을 위한 무상 안전교육 자료 지원부터 소년원 출소 청소년들의 사회 복귀를 돕는 교화 안전 교육까지, 미래 세대를 향한 지속적인 교육 지원 사업을 통해 사회적 안전망을 구축하고 더 건강한 공동체를 만들어갑니다."
                    }
                }
            }
        ]
    };

    let appData = null; 
    let isAdminAuthenticated = false;
    let currentAdminTabIdx = 0;
    const appEl = document.getElementById('app');

    function textToListHtml(text) { if(!text) return ''; return text.split('\n').filter(t => t.trim() !== '').map(item => `<li>${item}</li>`).join(''); }
    function formatTextToBr(text) { if(!text) return ''; return text.replace(/\n/g, '<br/>'); }
    function getVal(path) { return path.split('.').reduce((acc, part) => acc && acc[part], appData); }
    function setVal(path, value) { const parts = path.split('.'); const last = parts.pop(); const target = parts.reduce((acc, part) => acc[part], appData); target[last] = value; }

    async function initApp() {
        appEl.innerHTML = `<div class="index-screen"><h1 style="font-size:22px; margin-bottom:12px; color:#111;">데이터 로딩 중...</h1><p style="font-size:15px; color:#666;">Supabase 서버에서 정보를 가져오고 있습니다 ⏳</p></div>`;
        try {
            const { data, error } = await supabaseClient.from('profile_settings').select('data').eq('id', 1).single();
            if (error) throw error;
            if (data && data.data && Object.keys(data.data).length > 0) {
                appData = data.data;
                // v7 마이그레이션 (type2의 하단 고정 영역을 탭2 내부 블록으로 이동)
                if (!appData.version || appData.version < 7) {
                    if (appData.profileList) {
                        appData.profileList.forEach(p => {
                            if (p.type === 'type2' && p.data && p.data.footer) {
                                if (p.data.tabs && p.data.tabs.length > 1) {
                                    if (!p.data.tabs[1].blocks) p.data.tabs[1].blocks = [];
                                    // 기존 탭2의 원래 내용을 첫 번째 블록으로
                                    p.data.tabs[1].blocks.push({
                                        title: p.data.tabs[1].title,
                                        quote: p.data.tabs[1].quote,
                                        text: p.data.tabs[1].text,
                                        imageUrl: p.data.tabs[1].imageUrl
                                    });
                                    // 탭2의 메인 내용을 비움 (블록으로 옮겼으므로)
                                    p.data.tabs[1].title = "";
                                    p.data.tabs[1].quote = "";
                                    p.data.tabs[1].text = "";
                                    p.data.tabs[1].imageUrl = "";
                                    
                                    // 푸터의 내용을 두 번째 블록으로
                                    p.data.tabs[1].blocks.push({
                                        title: p.data.footer.title,
                                        quote: p.data.footer.quote,
                                        text: p.data.footer.text,
                                        imageUrl: ""
                                    });
                                    
                                    // 푸터 삭제
                                    delete p.data.footer;
                                }
                            }
                        });
                    }
                    appData.version = 7;
                    await saveToSupabase(appData, false);
                }
            } else {
                appData = JSON.parse(JSON.stringify(defaultData));
                await saveToSupabase(appData, false);
            }
        } catch (err) {
            console.error('DB 불러오기 에러:', err);
            appData = JSON.parse(JSON.stringify(defaultData));
            if (err.code === 'PGRST116') await saveToSupabase(appData, false);
        }
        
        let hash = window.location.hash.substring(1);
        if(appData && appData.profileList) {
            let foundIdx = appData.profileList.findIndex(p => p.id === hash);
            if(foundIdx !== -1) currentAdminTabIdx = foundIdx;
        }
        router();
    }

    async function saveToSupabase(dataObj, showAlert = true) {
        const { error } = await supabaseClient.from('profile_settings').upsert({ id: 1, data: dataObj }); 
        if (error) { console.error('DB 저장 에러:', error); if (showAlert) alert('서버 저장 중 오류가 발생했습니다: ' + error.message); } 
        else { if (showAlert) alert('서버(Supabase)에 성공적으로 저장되었습니다!'); }
    }

    function renderIndex() {
        document.body.className = 'theme-index';
        appEl.innerHTML = `
            <div class="index-screen">
                <h1 style="font-size:22px; font-weight:800; margin-bottom:12px; color:#111;">프로필 홈페이지</h1>
            </div>
        `;
    }

    function applyTheme(p) {
        let t = THEMES[p.theme];
        if(!t) {
            // 호환성 처리: 옛날 테마 타입인 경우
            t = p.type === 'type2' ? THEMES.copper : THEMES.pink;
        }
        document.body.style.backgroundColor = t.bg;
        appEl.style.setProperty('--page-bg', t.pageBg);
        appEl.style.setProperty('--page-text', t.text);
        appEl.style.setProperty('--card-bg', t.cardBg);
        appEl.style.setProperty('--accent', t.accent);
        appEl.style.setProperty('--border', t.cardBg === '#ffffff' ? '1px solid #eee' : '1px solid #444');
        appEl.style.color = 'var(--page-text)';
    }

    function renderType1(d, p) {
        document.body.className = '';
        applyTheme(p);
        let topImagesHtml = '';
        let contactsHtml = '';
        d.contacts.forEach(c => {
            if (c.type === 'image') {
                const imgHtml = `<div style="${c.position === 'top' ? 'margin-bottom:15px;' : 'grid-column: 1 / -1; margin: 10px 0;'}"><img src="${c.content}" style="max-width:100%; border-radius:8px; display:block; margin:0 auto;" alt="기본 정보 이미지"></div>`;
                if (c.position === 'top') topImagesHtml += imgHtml;
                else contactsHtml += imgHtml;
            } else {
                contactsHtml += `<a href="${c.link}" target="_blank" class="contact-icon"><i>${c.icon}</i><span>${c.label}</span></a>`;
            }
        });
        let accordionsHtml = (d.accordions || []).map((acc, sIdx) => {
            if (acc.type === 'tabs') {
                const renderLinks = (linkString) => {
                    if(!linkString) return '';
                    return linkString.split('\n').filter(l => l.trim() !== '').map(item => {
                        const parts = item.split('|'); return `<a href="${parts[1] || '#'}" target="_blank" class="btn btn-outline" style="padding:10px; margin-bottom:10px;">${parts[0]}</a>`;
                    }).join('');
                };
                let tabsBtnHtml = (acc.tabs||[]).map((tab, i) => `<button class="tab-btn ${i===0?'active':''}" onclick="switchTab('tab-${sIdx}-${i}', this, ${sIdx})">${tab.tabName}</button>`).join('');
                let tabsContentHtml = (acc.tabs||[]).map((tab, i) => {
                    let imgHtml = tab.imageUrl ? `<img src="${tab.imageUrl}" style="max-width:100%; border-radius:8px; margin-bottom:15px; display:block;" alt="탭 이미지">` : '';
                    return `<div id="tab-${sIdx}-${i}" class="tab-content-${sIdx} tab-content ${i===0?'active':''}"><div class="card"><h2 style="font-size: 18px; margin-bottom: 10px;">${tab.title}</h2>${tab.quote ? `<div class="quote-box" style="font-size:13px; text-align:left;">"${tab.quote}"</div>` : ''}${imgHtml}<p style="font-size: 14px; color: inherit; opacity:0.9; line-height: 1.6; margin-bottom:15px;">${formatTextToBr(tab.text)}</p><div class="link-list">${renderLinks(tab.links)}</div></div></div>`;
                }).join('');
                return `<div style="margin-bottom:20px;"><div class="tabs-container">${tabsBtnHtml}</div>${tabsContentHtml}</div>`;
            } else {
                let blocksHtml = (acc.blocks||[]).map(b => {
                    if (b.type === 'button') return `<a href="${b.content}" target="_blank" class="btn btn-outline" style="margin-bottom:15px; padding:10px;">${b.title}</a>`;
                    else if (b.type === 'list') return `<div class="block-text">${b.title ? `<b>${b.title}</b>` : ''}<ul class="custom-list">${textToListHtml(b.content)}</ul></div>`;
                    else if (b.type === 'image') return `<div class="block-text">${b.title ? `<b style="display:block; margin-bottom:10px;">${b.title}</b>` : ''}<img src="${b.content}" style="max-width:100%; border-radius:8px; display:block; margin:0 auto;" alt="이미지"></div>`;
                    else return `<div class="block-text">${b.title ? `<b>${b.title}</b>` : ''} ${formatTextToBr(b.content)}</div>`;
                }).join('');
                return `<div class="accordion-item"><div class="accordion-header" onclick="toggleAccordion(this)"><span>${acc.title}</span> <span style="font-size:12px; opacity:0.6;">▼</span></div><div class="accordion-content"><div class="accordion-inner"><div class="accordion-body" style="padding-top:5px;">${blocksHtml}</div></div></div></div>`;
            }
        }).join('');
        appEl.innerHTML = `<div class="header">${topImagesHtml}<h1>${d.name}</h1><p>${d.subtitle}</p><div class="contact-grid">${contactsHtml}</div></div><div class="section">${accordionsHtml}</div>`;
    }

    window.toggleAccordion = function(el) {
        const content = el.nextElementSibling;
        const isOpen = content.classList.contains('open');
        document.querySelectorAll('.accordion-content').forEach(acc => acc.classList.remove('open'));
        if (!isOpen) content.classList.add('open');
    };

    function renderType2(d, p) {
        document.body.className = '';
        applyTheme(p);
        const renderLinks = (linkString) => {
            if(!linkString) return '';
            return linkString.split('\n').filter(l => l.trim() !== '').map(item => {
                const parts = item.split('|'); return `<a href="${parts[1] || '#'}" target="_blank" class="btn btn-outline">${parts[0]}</a>`;
            }).join('');
        };
        let tabsBtnHtml = d.tabs.map((tab, i) => `<button class="tab-btn ${i===0?'active':''}" onclick="switchTab('tab-${i}', this)">${tab.tabName}</button>`).join('');
        let tabsContentHtml = d.tabs.map((tab, i) => {
            let imgHtml = tab.imageUrl ? `<img src="${tab.imageUrl}" style="max-width:100%; border-radius:8px; margin-bottom:15px; display:block;" alt="탭 이미지">` : '';
            let blocksHtml = '';
            if (tab.blocks && tab.blocks.length > 0) {
                blocksHtml = '<div style="margin-top:20px; padding-top:20px; border-top:1px solid #eee;">' + tab.blocks.map(b => {
                    let bImg = b.imageUrl ? `<img src="${b.imageUrl}" style="max-width:100%; border-radius:8px; margin-bottom:15px; display:block;" alt="서브 탭 이미지">` : '';
                    return `<div style="margin-bottom:25px;"><h3 style="font-size: 16px; margin-bottom: 8px; color:var(--accent);">${b.title}</h3>${b.quote ? `<div class="quote-box" style="font-size:13px; text-align:left;">"${b.quote}"</div>` : ''}${bImg}<p style="font-size: 14px; color: #555; line-height: 1.6;">${formatTextToBr(b.text)}</p></div>`;
                }).join('') + '</div>';
            }
            return `<div id="tab-${i}" class="section tab-content ${i===0?'active':''}"><div class="card"><h2 style="font-size: 18px; margin-bottom: 10px;">${tab.title}</h2><div class="quote-box" style="font-size:13px; text-align:left;">"${tab.quote}"</div>${imgHtml}<p style="font-size: 14px; color: #555; line-height: 1.6;">${formatTextToBr(tab.text)}</p><div class="link-list">${renderLinks(tab.links)}</div>${blocksHtml}</div></div>`;
        }).join('');

        appEl.innerHTML = `
            <div class="header" style="padding-bottom: 0;"><h1 style="color:var(--accent);">${d.top.title}</h1><div class="quote-box">"${d.top.quote}"</div><p style="color:#666;">${formatTextToBr(d.top.text)}</p></div>
            <div class="tabs-container">${tabsBtnHtml}</div>${tabsContentHtml}
            <br/><br/>`;
    }

    window.switchTab = function(tabId, btnEl, sIdx) {
        if (sIdx !== undefined) {
            document.querySelectorAll(`.tab-content-${sIdx}`).forEach(el => el.classList.remove('active'));
            btnEl.parentElement.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        } else {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        }
        document.getElementById(tabId).classList.add('active');
        btnEl.classList.add('active');
    };

    /* ==========================================
       6. 관리자 패널 로직
       ========================================== */
    window.syncInputsBeforeAction = function() {
        document.querySelectorAll('.admin-input, input[type="text"], textarea, select').forEach(el => {
            const pathMatch = el.getAttribute('oninput')?.match(/'([^']+)'/);
            if(pathMatch) setVal(pathMatch[1], el.value);
        });
    }

    window.openModal = function(id) { document.getElementById(id).classList.add('active'); }
    window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); }
    window.selectBlockType = function(btn, type) {
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('addBlockType').value = type;
    }

    window.showAddProfileModal = function() {
        document.getElementById('addProfileId').value = '';
        document.getElementById('addProfileName').value = '';
        document.getElementById('addProfileTheme').value = 'pink';
        openModal('modalAddProfile');
    }
    window.confirmAddProfile = function() {
        const pId = document.getElementById('addProfileId').value.trim();
        const pName = document.getElementById('addProfileName').value.trim();
        const pTheme = document.getElementById('addProfileTheme').value;

        if(!pId) return alert('접속 주소를 입력해주세요.');
        if(appData.profileList.some(p => p.id === pId)) return alert('이미 존재하는 접속 주소입니다.');

        let newProfile = { id: pId, type: 'type1', theme: pTheme, title: pName || pId, data: JSON.parse(JSON.stringify(defaultData.profileList[0].data)) };

        syncInputsBeforeAction();
        appData.profileList.push(newProfile);
        currentAdminTabIdx = appData.profileList.length - 1;
        closeModal('modalAddProfile');
        renderAdmin();
    }

    window.deleteProfile = function(idx) {
        if(appData.profileList.length <= 1) return alert("최소 1개의 프로필은 유지해야 합니다.");
        if(confirm(`정말로 이 프로필을 완전히 삭제하시겠습니까?`)) {
            syncInputsBeforeAction();
            appData.profileList.splice(idx, 1);
            currentAdminTabIdx = 0;
            renderAdmin();
        }
    }

    window.arrDel = function(path, index) {
        if(confirm('정말 삭제하시겠습니까?')) {
            syncInputsBeforeAction();
            let arr = getVal(path);
            arr.splice(index, 1);
            renderAdmin();
        }
    }
    
    window.addHeaderItem = function(pIdx, type) { 
        syncInputsBeforeAction(); 
        if (type === 'image') {
            appData.profileList[pIdx].data.contacts.push({ type: 'image', content: '' }); 
        } else {
            appData.profileList[pIdx].data.contacts.push({ type: 'contact', icon: "🔗", label: "새 링크", link: "#" }); 
        }
        renderAdmin(); 
    }
    window.addAccordion = function(pIdx) { syncInputsBeforeAction(); appData.profileList[pIdx].data.accordions.push({ type: "accordion", title: "새 카테고리 (대제목)", blocks: [] }); renderAdmin(); }
    window.addTabsCategory = function(pIdx) { syncInputsBeforeAction(); appData.profileList[pIdx].data.accordions.push({ type: "tabs", title: "탭 메뉴 그룹", tabs: [] }); renderAdmin(); }
    window.showAddBlockModal = function(pIdx, accIdx) {
        document.getElementById('addBlockPIdx').value = pIdx;
        document.getElementById('addBlockAccIdx').value = accIdx;
        openModal('modalAddBlock');
    }
    window.confirmAddBlock = function() {
        const pIdx = document.getElementById('addBlockPIdx').value;
        const accIdx = document.getElementById('addBlockAccIdx').value;
        const type = document.getElementById('addBlockType').value;
        
        syncInputsBeforeAction();
        appData.profileList[pIdx].data.accordions[accIdx].blocks.push({ 
            type: type, 
            title: type==='button'?'버튼명':(type==='image'?'이미지설명(선택)':'소제목(선택)'), 
            content: type==='image'?"이미지URL주소를넣으세요":"내용을 입력하세요" 
        });
        closeModal('modalAddBlock');
        renderAdmin();
    }
    window.addTabContent = function(pIdx, i) { 
        syncInputsBeforeAction(); 
        if (i !== undefined) {
            appData.profileList[pIdx].data.accordions[i].tabs.push({ tabName: "새 탭 버튼", title: "섹션 제목", quote: "인용구", imageUrl: "", text: "본문 내용", links: "버튼명|#" }); 
        } else {
            appData.profileList[pIdx].data.tabs.push({ tabName: "새 탭 버튼", title: "섹션 제목", quote: "인용구", imageUrl: "", text: "본문 내용", links: "버튼명|#", blocks: [] }); 
        }
        renderAdmin(); 
    }
    window.addSubCategory = function(pIdx, tIdx) { syncInputsBeforeAction(); if(!appData.profileList[pIdx].data.tabs[tIdx].blocks) appData.profileList[pIdx].data.tabs[tIdx].blocks = []; appData.profileList[pIdx].data.tabs[tIdx].blocks.push({ title: "새 서브 카테고리", quote: "", imageUrl: "", text: "본문 내용" }); renderAdmin(); }

    function renderAdmin() {
        document.body.className = 'theme-admin';
        if (!isAdminAuthenticated) {
            appEl.innerHTML = `<div class="admin-login"><h2>관리자 로그인</h2><p style="margin-bottom:20px; color:#666;">비밀번호를 입력하세요.</p><input type="password" id="adminPwd" placeholder="비밀번호"><button class="btn" onclick="checkPwd()">로그인</button></div>`;
            return;
        }

        let tabsHtml = `<div class="admin-tabs-row" id="sortable-profiles">`;
        appData.profileList.forEach((p, idx) => {
            let activeCls = (currentAdminTabIdx === idx) ? 'active' : 'inactive';
            tabsHtml += `<button class="${activeCls} sortable-profile-item" data-idx="${idx}" onclick="syncInputsBeforeAction(); currentAdminTabIdx=${idx}; renderAdmin()"><span class="drag-handle" style="color: ${activeCls==='active'?'#fff':'#999'};">☰</span> ${p.title}</button>`;
        });
        tabsHtml += `</div><button class="btn-add" onclick="showAddProfileModal()" style="margin-bottom:20px; background:#333; color:#fff; border:none; padding:12px; font-size:14px;">+ 새 프로필 만들기</button>`;

        let contentHtml = '';

    function initSortables() {
        if(typeof Sortable === 'undefined') return setTimeout(initSortables, 100);
        const updateArray = (arrPath, oldIdx, newIdx) => {
            syncInputsBeforeAction();
            let arr = getVal(arrPath);
            const item = arr.splice(oldIdx, 1)[0];
            arr.splice(newIdx, 0, item);
            if(arrPath === 'profileList') currentAdminTabIdx = newIdx; 
            renderAdmin(); 
        };

        const profilesEl = document.getElementById('sortable-profiles');
        if(profilesEl) Sortable.create(profilesEl, { handle: '.drag-handle', animation: 150, ghostClass: 'sortable-ghost', onEnd: e => updateArray('profileList', e.oldIndex, e.newIndex) });

        const pIdx = currentAdminTabIdx;
        const p = appData.profileList[pIdx];
        if(!p) return;

        if (p.type === 'type1') {
            const contactsEl = document.getElementById(`sortable-contacts-${pIdx}`);
            if(contactsEl) Sortable.create(contactsEl, { handle: '.drag-handle', animation: 150, ghostClass: 'sortable-ghost', onEnd: e => updateArray(`profileList.${pIdx}.data.contacts`, e.oldIndex, e.newIndex) });

        const accordionsEl = document.getElementById(`sortable-accordions-${pIdx}`);
        if(accordionsEl) {
            Sortable.create(accordionsEl, { handle: '.drag-handle', animation: 150, ghostClass: 'sortable-ghost', onEnd: e => updateArray(`profileList.${pIdx}.data.accordions`, e.oldIndex, e.newIndex) });
            p.data.accordions.forEach((acc, aIdx) => {
                if (acc.type === 'tabs') {
                    const tabsEl = document.getElementById(`sortable-tabs-${pIdx}-${aIdx}`);
                    if(tabsEl) Sortable.create(tabsEl, { handle: '.drag-handle', animation: 150, ghostClass: 'sortable-ghost', onEnd: e => updateArray(`profileList.${pIdx}.data.accordions.${aIdx}.tabs`, e.oldIndex, e.newIndex) });
                } else {
                    const blocksEl = document.getElementById(`sortable-blocks-${pIdx}-${aIdx}`);
                    if(blocksEl) Sortable.create(blocksEl, { handle: '.drag-handle', animation: 150, ghostClass: 'sortable-ghost', onEnd: e => updateArray(`profileList.${pIdx}.data.accordions.${aIdx}.blocks`, e.oldIndex, e.newIndex) });
                }
            });
        }
        } else if (p.type === 'type2' || p.data.tabs) {
            const tabsEl = document.getElementById(`sortable-tabs-${pIdx}`);
            if(tabsEl) Sortable.create(tabsEl, { handle: '.drag-handle', animation: 150, ghostClass: 'sortable-ghost', onEnd: e => updateArray(`profileList.${pIdx}.data.tabs`, e.oldIndex, e.newIndex) });
            p.data.tabs.forEach((tab, tIdx) => {
                const subblocksEl = document.getElementById(`sortable-subblocks-${pIdx}-${tIdx}`);
                if(subblocksEl) Sortable.create(subblocksEl, { handle: '.drag-handle', animation: 150, ghostClass: 'sortable-ghost', onEnd: e => updateArray(`profileList.${pIdx}.data.tabs.${tIdx}.blocks`, e.oldIndex, e.newIndex) });
            });
        }
    }

    function router() {
        let currentUploadPath = '';
        window.openImageUploader = function(path) { currentUploadPath = path; document.getElementById('globalImageInput').click(); };
        window.processGlobalImageUpload = function(input) {
            if(input.files && input.files[0]) {
                syncInputsBeforeAction();
                handleImageUpload(input.files[0], function(base64) { setVal(currentUploadPath, base64); renderAdmin(); });
            }
            input.value = '';
        };
        window.handleDragOver = function(e) { e.preventDefault(); e.currentTarget.style.borderColor = '#0066cc'; e.currentTarget.style.background = '#f0f7ff'; };
        window.handleDragLeave = function(e) { e.preventDefault(); e.currentTarget.style.borderColor = '#ccc'; e.currentTarget.style.background = '#fafafa'; };
        window.handleDrop = function(e, path) {
            e.preventDefault(); e.currentTarget.style.borderColor = '#ccc'; e.currentTarget.style.background = '#fafafa';
            if(e.dataTransfer.files && e.dataTransfer.files[0]) {
                syncInputsBeforeAction();
                handleImageUpload(e.dataTransfer.files[0], function(base64) { setVal(path, base64); renderAdmin(); });
            }
        };
        function handleImageUpload(file, callback) {
            if (!file || !file.type.startsWith('image/')) return alert('이미지 파일만 업로드 가능합니다.');
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width; let h = img.height;
                    const MAX_SIZE = 800; 
                    if (w > h) { if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } } else { if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; } }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        window.getImageFieldHtml = (path, val) => {
            return `<div class="image-dropzone" onclick="openImageUploader('${path}')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, '${path}')">${val ? `<img src="${val}" style="max-height:80px; max-width:100%; object-fit:contain; border-radius:4px; margin-bottom:8px;"><br>클릭하거나 새 이미지를 드롭하여 변경` : '🖼️ 클릭하거나 이미지를 드래그 앤 드롭하세요'}</div><input type="text" style="margin-top:8px;" placeholder="또는 URL 직접 입력 (http://...)" value="${val}" oninput="setVal('${path}', this.value)">`;
        };

        if (!appData) return; 
        const hash = window.location.hash.substring(1);
        appEl.style.opacity = '0';
        setTimeout(() => {
            if (hash === 'admin') { renderAdmin(); } 
            else if (!hash) { renderIndex(); } 
            else {
                const found = appData.profileList.find(p => p.id === hash);
                if (found) {
                    if (found.type === 'type1' || found.data.accordions) renderType1(found.data, found);
                    else if (found.type === 'type2' || found.data.tabs) renderType2(found.data, found);
                } else { renderIndex(); }
            }
            appEl.style.opacity = '1';
            window.scrollTo(0, 0);
        }, 50); 
    }

    window.goToHash = function(hashName) { window.location.hash = hashName; router(); };
    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', initApp);

</script>
</body>
</html>
