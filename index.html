                .single();
            
            if (error) throw error;

            // 데이터가 유효하면 appData에 할당, 아니면 기본값 사용 후 서버에 덮어쓰기
            if (data && data.data && Object.keys(data.data).length > 0 && data.data.version === defaultData.version) {
                appData = data.data;
            } else {
                appData = JSON.parse(JSON.stringify(defaultData));
                await saveToSupabase(appData, false);
            }
        } catch (err) {
            console.error('DB 불러오기 에러:', err);
            // 에러 발생 시 임시로 기본 데이터 사용
            appData = JSON.parse(JSON.stringify(defaultData));
        }

        // 로딩이 끝나면 현재 해시에 맞춰 렌더링
        router();
    }

    // 서버로 데이터 저장 함수
    async function saveToSupabase(dataObj, showAlert = true) {
        const { error } = await supabaseClient
            .from('profile_settings')
            .update({ data: dataObj })
            .eq('id', 1);
            
        if (error) {
            console.error('DB 저장 에러:', error);
            if (showAlert) alert('서버 저장 중 오류가 발생했습니다: ' + error.message);
        } else {
            if (showAlert) alert('서버(Supabase)에 성공적으로 저장되었습니다!');
        }
    }

            [arr[index-1], arr[index]] = [arr[index], arr[index-1]];

            [arr[index+1], arr[index]] = [arr[index], arr[index+1]];

    window.saveDataFinal = async function(btnEl) {

        document.querySelectorAll('.admin-input, input[type="text"], textarea').forEach(el => {
            const path = el.getAttribute('oninput')?.match(/'([^']+)'/)?.[1];
            if(path) {
                setVal(path, el.value);
            }
        });

        // 저장 중 버튼 클릭 방지 (중복 전송 방지)
        const originalText = btnEl.innerText;
        btnEl.innerText = "⏳ 통신 중...";
        btnEl.disabled = true;

        await saveToSupabase(appData, true); // 서버로 전송

        btnEl.innerText = originalText;
        btnEl.disabled = false;
    };

    /* ==========================================
       7. 라우팅 로직 (Hash Router)
       ========================================== */
    function router() {
        if (!appData) return; // 데이터가 아직 불러와지지 않았으면 렌더링 중단

        const hash = window.location.hash;
        
        appEl.style.opacity = '0';
        
        setTimeout(() => {
            if (hash === '#Copper_CEO') renderCopperCEO();
            else if (hash === '#star_bodre') renderStarBodre();
            else if (hash === '#admin') renderAdmin();
            else renderIndex();
            
            appEl.style.opacity = '1';
            window.scrollTo(0, 0);
        }, 50); 
    }

    window.goToHash = function(hashName) {
        window.location.hash = hashName;
        router();
    };

    // 해시가 바뀌면 바로바로 화면 교체
    window.addEventListener('hashchange', router);
    
    // 브라우저 켜지면 무조건 DB 연동(initApp)부터 시작
    window.addEventListener('DOMContentLoaded', initApp);

</script>
</body>
</html>
